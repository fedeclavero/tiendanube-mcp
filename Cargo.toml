[package]
name = "tiendanube-mcp"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
description = "Servidor MCP para vendedores de Tiendanube y Nuvemshop"
license = "MIT"
repository = "https://github.com/fedeclavero/tiendanube-mcp"
include = ["/src/*.rs", "/src/data/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/tests/*.rs", "/tests/fixtures/*.json"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
jsonschema = { version = "0.46", default-features = false }
libc = "0.2"
open = "5"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
rmcp = { version = "3.11", features = ["client", "transport-child-process", "transport-io", "transport-streamable-http-server"] }
rpassword = "7"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
subtle = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml_edit = "0.25"
unicode-normalization = "0.1"
url = "2"
which = "8"

[profile.release]
lto = "thin"
strip = "debuginfo"
